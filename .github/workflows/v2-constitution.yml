name: V2 Constitution Gate

on:
  push:
    branches:
      - v2-system-constitution
      - living-navigation-stage
  pull_request:

jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Capture dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Constitution audit
        run: npm run v2:audit
      - name: Tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
        run: npm run build

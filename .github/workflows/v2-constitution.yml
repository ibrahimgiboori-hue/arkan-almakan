name: V2 Constitution Gate

on:
  push:
    branches:
      - v2-system-constitution
  pull_request:

jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        # The repository does not yet track package-lock.json. Use npm install until
        # dependency locking is adopted deliberately, then switch this gate to npm ci.
        run: npm install --no-audit --no-fund
      - name: Constitution audit
        run: npm run v2:audit
      - name: Tests
        run: npm test
      - name: Production build
        # Build-only placeholders let Next/Supabase instantiate the browser client
        # during prerender without exposing or depending on production credentials.
        # No CI page should perform authenticated/live data I/O at build time.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
        run: npm run build

name: V2 Constitution Gate

on:
  push:
    branches:
      - v2-system-constitution
      - living-navigation-stage
  pull_request:

permissions:
  contents: write

jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and generate lock
        run: npm install --no-audit --no-fund
      - name: Persist dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/living-navigation-stage'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock dependency versions"
            git push
          fi
      - name: Constitution audit
        run: npm run v2:audit
      - name: Tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
        run: npm run build

name: V2 Constitution Gate

on:
  push:
    branches:
      - v2-system-constitution
      - living-navigation-stage
  pull_request:

permissions:
  contents: read

jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Constitution audit
        run: npm run v2:audit
      - name: Tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
        run: npm run build

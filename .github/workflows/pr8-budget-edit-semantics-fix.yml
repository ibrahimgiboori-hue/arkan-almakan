name: PR8 Budget Edit Semantics Fix

on:
  push:
    branches:
      - feat/contextual-work-budget-inputs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contextual-work-budget-inputs
          fetch-depth: 0
      - name: Patch operating budget UI semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/operating-budget/page.js')
          s = p.read_text()

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected source fragment not found:\n' + old[:300])
              s = s.replace(old, new, 1)

          rep("const COMPONENT_CALC_TYPES = ['employee_based_contribution', 'subscription_plus_usage', 'composite_formula'];\n", "const COMPONENT_CALC_TYPES = ['employee_based_contribution', 'subscription_plus_usage', 'composite_formula'];\nconst ONGOING_INPUT_CALC_TYPES = new Set(['fixed_amount', 'variable_monthly', 'quantity_x_unit_price']);\n")

          rep("function amountLabel(value) {\n  return `${money(value)} ريال`;\n}\n", "function amountLabel(value) {\n  return `${money(value)} ريال`;\n}\n\nfunction stableJson(value) {\n  if (Array.isArray(value)) return value.map(stableJson);\n  if (value && typeof value === 'object') {\n    return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stableJson(value[key])]));\n  }\n  return value ?? null;\n}\n\nfunction sameJson(left, right) {\n  return JSON.stringify(stableJson(left)) === JSON.stringify(stableJson(right));\n}\n")

          rep("    node_type: nodeType,\n    parent_item_id: parent?.id || '',\n", "    node_type: nodeType,\n    branch_scope_id: parent?.branch_scope_id || '',\n    parent_item_id: parent?.id || '',\n")
          rep("    valid_from: validFrom,\n    recurrence_unit: 'month',\n", "    valid_from: validFrom,\n    schedule_valid_to: '',\n    recurrence_unit: 'month',\n")

          rep("      node_type: node.node_type,\n      parent_item_id: node.parent_item_id || '',\n", "      node_type: node.node_type,\n      branch_scope_id: node.branch_scope_id || '',\n      parent_item_id: node.parent_item_id || '',\n")
          rep("      valid_from: rate?.valid_from || schedule?.valid_from || selectedMonthStart,\n      recurrence_unit: schedule?.recurrence_unit || 'month',\n", "      valid_from: rate?.valid_from || schedule?.valid_from || selectedMonthStart,\n      schedule_valid_to: schedule?.valid_to || '',\n      recurrence_unit: schedule?.recurrence_unit || 'month',\n")

          rep("      const schedulePayload = nodeForm.node_type === 'item' && nodeForm.anchor_date ? {\n        recurrence_unit: nodeForm.recurrence_unit,\n", "      const schedulePayload = nodeForm.node_type === 'item' && nodeForm.anchor_date ? {\n        valid_to: nodeForm.schedule_valid_to || null,\n        recurrence_unit: nodeForm.recurrence_unit,\n")

          old_block = '''      let revisionMode = 'new';
      let revisionValidFrom = nodeForm.valid_from;
      if (nodeForm.node_id && nodeForm.node_type === 'item' && (rateParams || schedulePayload)) {
        const currentEffectiveFrom = effectiveNodeRate?.valid_from || effectiveSchedule(nodeForm.node_id)?.valid_from || nodeForm.valid_from;
        const isCorrection = window.confirm(
          'هل هذا تصحيح لبيانات سابقة؟\\n\\nاختيار «موافق» يعيد حساب التقديرات فقط وفق المعلومة المصححة، ولا يغيّر القيمة الفعلية أو المدفوع.'
        );
        if (isCorrection) {
          revisionMode = 'correction';
          revisionValidFrom = currentEffectiveFrom;
        } else {
          const applyFromCurrentCycle = window.confirm(
            'هل تريد تطبيق التغيير من دورة ' + monthLabelAr(month) + ' وما بعدها؟\\n\\nاختيار «إلغاء» هنا يعني عدم الحفظ.'
          );
          if (!applyFromCurrentCycle) {
            setWorkErr('لم يتم الحفظ. عند تعديل قاعدة مالية قائمة اختر إما «تصحيح سابق» أو «تغيير من الدورة الحالية».');
            return;
          }
          revisionMode = 'current_cycle';
          revisionValidFrom = selectedMonthStart;
        }
      }

      if (schedulePayload && nodeForm.calculation_type !== 'external_forecast_actual' && !rateParams && !effectiveNodeRate) {
        throw new Error('عرّف قاعدة الحساب أولًا قبل جدولة الاستحقاق.');
      }

      const normalizedBands = nodeForm.bands.map((b, i) => ({
        band_order: i + 1,
        min_count: num(b.min_count),
        max_count: String(b.max_count ?? '').trim() === '' ? null : num(b.max_count),
        band_mode: b.band_mode || 'flat_fee_on_entry',
        band_amount: num(b.band_amount),
      }));
'''
          new_block = '''      const normalizedBands = nodeForm.bands.map((b, i) => ({
        band_order: i + 1,
        min_count: num(b.min_count),
        max_count: String(b.max_count ?? '').trim() === '' ? null : num(b.max_count),
        band_mode: b.band_mode || 'flat_fee_on_entry',
        band_amount: num(b.band_amount),
      }));

      const currentRate = nodeForm.node_id && nodeForm.node_type === 'item' ? effectiveRate(nodeForm.node_id) : null;
      const currentSchedule = nodeForm.node_id && nodeForm.node_type === 'item' ? effectiveSchedule(nodeForm.node_id) : null;
      const currentBands = currentRate ? bandsForRate(currentRate.id).map((b, i) => ({
        band_order: i + 1,
        min_count: num(b.min_count),
        max_count: b.max_count == null ? null : num(b.max_count),
        band_mode: b.band_mode || 'flat_fee_on_entry',
        band_amount: num(b.band_amount),
      })) : [];
      const currentEffectiveFrom = currentRate?.valid_from || currentSchedule?.valid_from || nodeForm.valid_from;
      const effectiveFromChanged = Boolean(nodeForm.node_id) && nodeForm.valid_from !== currentEffectiveFrom;
      const rateChanged = Boolean(rateParams) && (
        !currentRate || effectiveFromChanged || !sameJson(rateParams, currentRate.params || {}) || !sameJson(normalizedBands, currentBands)
      );
      const scheduleChanged = Boolean(schedulePayload) && (
        !currentSchedule || effectiveFromChanged ||
        (currentSchedule.valid_to || null) !== (schedulePayload.valid_to || null) ||
        currentSchedule.recurrence_unit !== schedulePayload.recurrence_unit ||
        Number(currentSchedule.recurrence_interval_count || 1) !== Number(schedulePayload.recurrence_interval_count || 1) ||
        currentSchedule.anchor_date !== schedulePayload.anchor_date ||
        currentSchedule.accrual_start_rule !== schedulePayload.accrual_start_rule ||
        Number(currentSchedule.accrual_lead_months || 0) !== Number(schedulePayload.accrual_lead_months || 0)
      );
      const financialConfigChanged = rateChanged || scheduleChanged;

      let revisionMode = 'new';
      let revisionValidFrom = nodeForm.valid_from;
      if (nodeForm.node_id && nodeForm.node_type === 'item' && financialConfigChanged) {
        const isCorrection = window.confirm(
          'هل هذا تصحيح لبيانات سابقة؟\\n\\nاختيار «موافق» يعيد حساب التقديرات فقط وفق المعلومة المصححة، ولا يغيّر القيمة الفعلية أو المدفوع.'
        );
        if (isCorrection) {
          revisionMode = 'correction';
          revisionValidFrom = currentEffectiveFrom;
        } else {
          const applyFromCurrentCycle = window.confirm(
            'هل تريد تطبيق التغيير من دورة ' + monthLabelAr(month) + ' وما بعدها؟\\n\\nاختيار «إلغاء» هنا يعني عدم الحفظ.'
          );
          if (!applyFromCurrentCycle) {
            setWorkErr('لم يتم الحفظ. عند تعديل قاعدة مالية قائمة اختر إما «تصحيح سابق» أو «تغيير من الدورة الحالية».');
            return;
          }
          revisionMode = 'current_cycle';
          revisionValidFrom = selectedMonthStart;
        }
      }

      if (schedulePayload && nodeForm.calculation_type !== 'external_forecast_actual' && !rateParams && !effectiveNodeRate) {
        throw new Error('عرّف قاعدة الحساب أولًا قبل جدولة الاستحقاق.');
      }
'''
          rep(old_block, new_block)

          rep("        p_branch_scope_id: null,\n", "        p_branch_scope_id: nodeForm.branch_scope_id || null,\n")

          rep("      p_reason: scope === 'this_month' ? 'تصحيح تقدير هذا الشهر' : 'تغيير مدخلات التقدير من الدورة الحالية وما بعدها',\n    }), scope === 'this_month' ? 'تم تصحيح تقدير هذا الشهر.' : 'تم تسجيل التغيير من الدورة الحالية.', setWorkErr);", "      p_reason: scope === 'this_month' ? 'تحديث تقدير هذا الشهر' : 'تغيير القيمة الافتراضية للتقدير من الدورة الحالية وما بعدها',\n    }), scope === 'this_month' ? 'تم تحديث تقدير هذا الشهر.' : 'تم تغيير القيمة الافتراضية من الدورة الحالية وما بعدها.', setWorkErr);")

          rep("            {selectedLineFields.length > 0 && <button className=\"btn\" onClick={() => saveLineEstimate('this_month')}>تصحيح هذا الشهر</button>}\n            {selectedLineFields.length > 0 && <button className=\"btn ghost\" onClick={() => saveLineEstimate('ongoing')}>تغيير من الدورة الحالية</button>}\n", "            {selectedLineFields.length > 0 && <button className=\"btn\" onClick={() => saveLineEstimate('this_month')}>حفظ تقدير هذا الشهر</button>}\n            {selectedLineFields.length > 0 && ONGOING_INPUT_CALC_TYPES.has(selectedLine.calculation_type) && <button className=\"btn ghost\" onClick={() => saveLineEstimate('ongoing')}>اجعلها القيمة الافتراضية من هذا الشهر</button>}\n")

          rep("              <div className=\"field\"><label>تاريخ الاستحقاق المرجعي</label><input type=\"date\" dir=\"ltr\" value={nodeForm.anchor_date} onChange={(e) => setNodeForm((old) => ({ ...old, anchor_date: e.target.value }))} /></div>\n", "              <div className=\"field\"><label>تاريخ الاستحقاق المرجعي</label><input type=\"date\" dir=\"ltr\" value={nodeForm.anchor_date} onChange={(e) => setNodeForm((old) => ({ ...old, anchor_date: e.target.value }))} /></div>\n              <div className=\"field\"><label>نهاية السريان (اختياري)</label><input type=\"date\" dir=\"ltr\" value={nodeForm.schedule_valid_to || ''} onChange={(e) => setNodeForm((old) => ({ ...old, schedule_valid_to: e.target.value }))} /><small className=\"muted\">اتركها فارغة إذا كان الالتزام مستمرًا بلا نهاية محددة.</small></div>\n")

          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git rm .github/workflows/pr8-budget-edit-semantics-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/operating-budget/page.js
          git commit -m "Fix budget descriptive and monthly estimate editing"
          git push origin HEAD:feat/contextual-work-budget-inputs

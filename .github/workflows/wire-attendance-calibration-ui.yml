name: Wire attendance calibration UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-attendance-calibration-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch page
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit
        run: |
          git config user.name "arkan-system"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard/attendance/page.js
          git rm .github/workflows/wire-attendance-calibration-ui.yml
          git commit -m "Wire automatic attendance hours calibration"
          git push origin HEAD:main

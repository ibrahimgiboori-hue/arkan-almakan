name: Wire document pack manager

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_wire-document-pack-manager.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire core access UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/dashboard/system-user/page.js')
          text = path.read_text()

          old_import = "import { PROJECT_ACCESS_LEVELS } from '@/lib/access-ui';\n"
          new_import = old_import + "import DocumentPackAccessManager from '@/components/documents/DocumentPackAccessManager';\n"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('access-ui import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_block = """            </>}\n        </>}\n      </div>\n    </div>\n\n    {deletePlan &&"""
          new_block = """            </>}\n          <DocumentPackAccessManager userId={selectedUser.id} primaryUserId={directory.primaryUserId} />\n        </>}\n      </div>\n    </div>\n\n    {deletePlan &&"""
          if new_block not in text:
              if old_block not in text:
                  raise SystemExit('selected-user closing anchor not found')
              text = text.replace(old_block, new_block, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- app/dashboard/system-user/page.js
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'arkan-system'
          git config user.email 'actions@users.noreply.github.com'
          git add app/dashboard/system-user/page.js
          git commit -m 'Integrate document packs with user access management'
          git push origin HEAD:main

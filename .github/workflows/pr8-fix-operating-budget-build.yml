name: PR8 one-shot build syntax fix

on:
  push:
    branches:
      - feat/contextual-work-budget-inputs

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contextual-work-budget-inputs
      - name: Fix multiline confirmation strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/operating-budget/page.js')
          text = p.read_text()
          old1 = "'هل هذا تصحيح لبيانات سابقة؟\n\nاختيار «موافق» يعيد حساب التقديرات فقط وفق المعلومة المصححة، ولا يغيّر القيمة الفعلية أو المدفوع.'"
          new1 = "'هل هذا تصحيح لبيانات سابقة؟\\n\\nاختيار «موافق» يعيد حساب التقديرات فقط وفق المعلومة المصححة، ولا يغيّر القيمة الفعلية أو المدفوع.'"
          old2 = "'هل تريد تطبيق التغيير من دورة ' + monthLabelAr(month) + ' وما بعدها؟\n\nاختيار «إلغاء» هنا يعني عدم الحفظ.'"
          new2 = "'هل تريد تطبيق التغيير من دورة ' + monthLabelAr(month) + ' وما بعدها؟\\n\\nاختيار «إلغاء» هنا يعني عدم الحفظ.'"
          if old1 not in text:
              raise SystemExit('first target string not found')
          if old2 not in text:
              raise SystemExit('second target string not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text)
          PY
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr8-fix-operating-budget-build.yml
          rm -f .pr8-build-syntax-trigger
          git add -A
          git commit -m "Fix operating budget build syntax"
          git push origin HEAD:feat/contextual-work-budget-inputs

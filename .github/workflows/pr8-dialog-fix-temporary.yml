name: PR8 Dialog Fix Temporary

on:
  push:
    branches:
      - feat/contextual-work-budget-inputs
    paths:
      - .github/workflows/pr8-dialog-fix-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/contextual-work-budget-inputs
          fetch-depth: 0

      - name: Validate fix script
        run: node --check scripts/pr8-dialog-fix-temporary.mjs

      - name: Apply guarded fix
        run: node scripts/pr8-dialog-fix-temporary.mjs

      - name: Verify changed page parses through build gate later
        run: git diff --check

      - name: Remove temporary tooling and commit result
        run: |
          rm -f .github/workflows/pr8-dialog-fix-temporary.yml scripts/pr8-dialog-fix-temporary.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/operating-budget/page.js .github/workflows/pr8-dialog-fix-temporary.yml scripts/pr8-dialog-fix-temporary.mjs
          git diff --cached --check
          git commit -m "Fix budget revision dialogs and wording"
          git push origin HEAD:feat/contextual-work-budget-inputs

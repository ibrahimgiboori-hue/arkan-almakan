name: Temporary Apply Reviewed Level 1 Patch

on:
  push:
    branches:
      - v2-system-constitution

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct exact reviewed patch
        run: |
          base64 -d .github/patches/level1.patch.gz.b64 | gzip -d > /tmp/level1.patch
          git apply --check /tmp/level1.patch
      - name: Apply exact reviewed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --3way /tmp/level1.patch
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Constitution audit
        run: npm run v2:audit
      - name: Tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
        run: npm run build
      - name: Push reviewed patch
        run: git push origin HEAD:v2-system-constitution

name: Wire attendance calibration UI once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wire-attendance-calibration-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch attendance page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/attendance/page.js')
          s=p.read_text()
          def rep(a,b):
              global s
              if a not in s:
                  raise SystemExit('missing snippet: '+a[:120])
              s=s.replace(a,b,1)

          rep("uploaded:'مرفوع', parsed:'تم الاستخراج', analyzed:'تم التحليل', justifications:'معالجة التبريرات',",
              "uploaded:'مرفوع', parsed:'تم الاستخراج', calibrated:'تمت معايرة الروتين', analyzed:'تم التحليل', justifications:'معالجة التبريرات',")
          rep("const STAGE_ORDER = ['parsed','analyzed','justifications','recalculated','ready_to_post','posted'];",
              "const STAGE_ORDER = ['parsed','calibrated','analyzed','justifications','recalculated','ready_to_post','posted'];")
          rep("  const [externalPeople,setExternalPeople] = useState([]);",
              "  const [externalPeople,setExternalPeople] = useState([]);\n  const [calibrationProposals,setCalibrationProposals] = useState([]);")
          marker="  async function loadImports(selectId = null) {"
          insert="""  const calibrationSummary = useMemo(() => {
    const people = new Map();
    employees.forEach((e)=>people.set(e.id,{no:e.employee_no||'',name:e.full_name_ar||''}));
    externalPeople.forEach((e)=>people.set(e.id,{no:e.external_employee_no||'',name:e.external_employee_name||''}));
    const groups = new Map();
    calibrationProposals.forEach((r)=>{
      const id = r.external_person_id || r.employee_id;
      if (!id) return;
      if (!groups.has(id)) groups.set(id,{id,rows:[]});
      groups.get(id).rows.push(r);
    });
    const rank={high:3,medium:2,low:1,insufficient:0};
    return Array.from(groups.values()).map((g)=>{
      const work=g.rows.filter((r)=>r.is_workday);
      const patterns=[...new Set(work.filter((r)=>r.proposed_start&&r.proposed_end).map((r)=>`${String(r.proposed_start).slice(0,5)}–${String(r.proposed_end).slice(0,5)}`))];
      const conf=work.length ? work.reduce((a,r)=>(rank[r.confidence]??0)<(rank[a]??0)?r.confidence:a,work[0].confidence||'insufficient') : 'insufficient';
      const candidate=Math.max(0,...work.map((r)=>Number(r.candidate_days||0)));
      const decisions=[...new Set(work.map((r)=>r.decision).filter(Boolean))];
      return {...g,...(people.get(g.id)||{}),patterns,confidence:conf,candidate_days:candidate,decision:decisions.join(' / ')||'pending'};
    }).sort((a,b)=>String(a.no||a.name).localeCompare(String(b.no||b.name),'ar'));
  }, [calibrationProposals,employees,externalPeople]);

"""
          rep(marker,insert+marker)
          rep("    if (!id) { setActiveImport(null); setDays([]); setEvents([]); setExternalPeople([]); return; }",
              "    if (!id) { setActiveImport(null); setDays([]); setEvents([]); setExternalPeople([]); setCalibrationProposals([]); return; }")
          rep("    const [iQ,dQ,eQ,pQ] = await Promise.all([\n      supabase.from('hr_attendance_imports').select('*').eq('id',id).single(),\n      supabase.from('v_hr_attendance_processing_days').select('*').eq('import_id',id).order('work_date').order('subject_no'),\n      supabase.from('hr_attendance_processing_events').select('*').eq('import_id',id).order('created_at'),\n      supabase.from('hr_attendance_external_people').select('*').eq('import_id',id).order('external_employee_no').order('external_employee_name'),\n    ]);",
              "    const [iQ,dQ,eQ,pQ,cQ] = await Promise.all([\n      supabase.from('hr_attendance_imports').select('*').eq('id',id).single(),\n      supabase.from('v_hr_attendance_processing_days').select('*').eq('import_id',id).order('work_date').order('subject_no'),\n      supabase.from('hr_attendance_processing_events').select('*').eq('import_id',id).order('created_at'),\n      supabase.from('hr_attendance_external_people').select('*').eq('import_id',id).order('external_employee_no').order('external_employee_name'),\n      supabase.from('hr_attendance_calibration_proposals').select('*').eq('import_id',id).order('weekday'),\n    ]);")
          rep("    setExternalPeople(pQ.error ? [] : (pQ.data || []));",
              "    setExternalPeople(pQ.error ? [] : (pQ.data || []));\n    setCalibrationProposals(cQ.error ? [] : (cQ.data || []));")
          rep("    if (action === 'analyze') q = await supabase.rpc('hr_analyze_attendance_import',{p_import_id:activeImport.id});",
              "    if (action === 'calibrate') q = await supabase.rpc('hr_calibrate_attendance_import',{p_import_id:activeImport.id,p_snap_minutes:60});\n    if (action === 'applyCalibration') q = await supabase.rpc('hr_apply_attendance_calibration',{p_import_id:activeImport.id,p_min_confidence:'medium'});\n    if (action === 'analyze') q = await supabase.rpc('hr_analyze_attendance_import',{p_import_id:activeImport.id});")
          rep("    const labels = {analyze:'تم التحليل الفني.',review:'بدأت مرحلة معالجة التبريرات.',recalculate:'تمت إعادة الاحتساب بعد المعالجة.',ready:'النتيجة جاهزة للمراجعة النهائية.',post:'تم الترحيل إلى سجل HR الرسمي.',close:'تم إغلاق المعالجة الخارجية دون أي أثر على HR.'};",
              "    const labels = {calibrate:'تمت معايرة الروتين جماعيًا من الملف على رؤوس الساعات.',applyCalibration:'تم اعتماد الحالات ذات الثقة المتوسطة فأعلى. الحالات غير الواضحة تبقى للمراجعة اليدوية.',analyze:'تم التحليل الفني.',review:'بدأت مرحلة معالجة التبريرات.',recalculate:'تمت إعادة الاحتساب بعد المعالجة.',ready:'النتيجة جاهزة للمراجعة النهائية.',post:'تم الترحيل إلى سجل HR الرسمي.',close:'تم إغلاق المعالجة الخارجية دون أي أثر على HR.'};")
          rep("          {stage==='parsed'&&<button className=\"btn\" disabled={busy} onClick={()=>runStage('analyze')}>تحليل البيانات</button>}",
              "          {stage==='parsed'&&<button className=\"btn\" disabled={busy} onClick={()=>runStage('calibrate')}>معايرة الروتين من الملف</button>}\n          {stage==='calibrated'&&<button className=\"btn\" disabled={busy} onClick={()=>runStage('applyCalibration')}>اعتماد الروتين المقترح الواضح</button>}\n          {stage==='calibrated'&&<button className=\"btn ghost\" disabled={busy} onClick={()=>runStage('analyze')}>تحليل البيانات بعد المراجعة</button>}")
          marker2="    {activeImport && !['posted','closed'].includes(stage) && <div className=\"section\">\n      <header><h2>روتين الدوام للدفعة</h2>"
          calibration_jsx="""    {activeImport && stage==='calibrated' && <div className="section">
      <header><h2>معايرة الروتين من الملف</h2><span className="hint">الروتين المقترح على رأس الساعة :00. نافذة المعايرة تساعد على اكتشاف المحور فقط وليست فترة سماح للتأخير.</span></header>
      <div style={{padding:18}}>
        <div className="rowsplit" style={{marginBottom:12}}><strong>{calibrationSummary.length} شخصًا تمت معايرتهم</strong><span className="hint">اعتمد الحالات الواضحة جماعيًا، وراجع الاستثناءات فقط.</span></div>
        <div style={{overflowX:'auto'}}><table><thead><tr><th>الشخص</th><th>الروتين المقترح</th><th>أيام القياس</th><th>الثقة</th><th>الحالة</th></tr></thead><tbody>{calibrationSummary.map((r)=><tr key={r.id}><td>{r.no?`${r.no} - `:''}{r.name||'غير معروف'}</td><td>{r.patterns.length?r.patterns.join('، '):'يحتاج مراجعة'}</td><td>{r.candidate_days}</td><td>{r.confidence==='high'?'عالية':r.confidence==='medium'?'متوسطة':r.confidence==='low'?'منخفضة':'غير كافية'}</td><td>{r.decision==='accepted'?'معتمد':r.decision==='manual'?'يدوي / روتين قائم':'مقترح'}</td></tr>)}</tbody></table>{!calibrationSummary.length&&<div className="hint" style={{padding:16}}>لا توجد مقترحات معايرة قابلة للعرض.</div>}</div>
        <p className="hint" style={{marginTop:12}}>إذا كانت الثقة منخفضة أو غير كافية، اختر الشخص في قسم مراجعة الروتين أدناه وعدّل حالته فقط. لا تحتاج إدخال روتين جميع الموظفين واحدًا واحدًا.</p>
      </div>
    </div>}

    {activeImport && !['posted','closed'].includes(stage) && <div className="section">
      <header><h2>مراجعة / تعديل الروتين</h2>"""
          rep(marker2,calibration_jsx)
          p.write_text(s)
          PY
          git config user.name "arkan-system"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard/attendance/page.js
          git rm .github/workflows/wire-attendance-calibration-once.yml
          git commit -m "Wire automatic attendance routine calibration"
          git push origin HEAD:main

name: Wire attendance report UI
on:
  push:
    paths:
      - 'scripts/wire-attendance-report-ui.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire report UI
        run: node scripts/wire-attendance-report-ui.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "arkan-system"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard/attendance/page.js components/attendance/AttendanceClientExcelReport.js components/attendance/AttendanceCalibrationPanel.js
          git commit -m "Wire attendance review experience"
          git push

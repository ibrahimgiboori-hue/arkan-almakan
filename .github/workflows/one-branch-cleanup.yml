name: One Branch Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'ibrahimgiboori-hue/arkan-almakan'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except the default branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const keep = repository.data.default_branch;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });
            core.info(`Keeping only: ${keep}`);
            for (const branch of branches) {
              if (branch.name === keep) continue;
              core.info(`Deleting branch: ${branch.name}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`,
              });
            }

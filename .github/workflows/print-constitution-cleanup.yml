name: One-time print constitution cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/print-constitution-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove local physical-page rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/print')
          central = {Path('app/print/print-system.css'), Path('app/print/print-constitution.css')}
          for p in root.rglob('*.css'):
              if p in central:
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'@page\s*\{[^{}]*\}', '', text, flags=re.I|re.S)
              text = re.sub(r'html\s*,\s*body\s*\{[^{}]*\}', '', text, flags=re.I|re.S)
              for token in (
                  'width:210mm;', 'width: 210mm;',
                  'height:297mm;', 'height: 297mm;',
                  'min-height:297mm;', 'min-height: 297mm;',
                  'background-size:210mm 297mm;', 'background-size: 210mm 297mm;',
                  'page-break-after:always;', 'page-break-after: always;',
                  'break-after:page;', 'break-after: page;',
              ):
                  text = text.replace(token, '')
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print('cleaned', p)
          PY
          rm -f app/print/procedure-system.css app/print/print-constitution-hardening.css
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git config user.name 'arkan-print-constitution'
          git config user.email 'actions@users.noreply.github.com'
          git add app/print
          git commit -m 'Remove legacy local print geometry'
          git push origin main

name: Unify budget save gateway

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_unify-budget-save-rpc.yml

permissions:
  contents: write

jobs:
  patch-budget-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch operating budget gateway
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('app/dashboard/operating-budget/page.js')
          text = page.read_text()
          start_marker = '      let saveResult;\n'
          end_marker = '      if (saveResult.error) throw saveResult.error;\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              if "supabase.rpc('budget_save_catalog_node'" in text and 'budget_save_catalog_item_revision' not in text and 'budget_save_catalog_node_v2' not in text:
                  print('Budget save path is already unified.')
              else:
                  raise SystemExit('Budget save block not found or unexpected state.')
          else:
              end += len(end_marker)
              lines = [
                  "      const saveResult = await supabase.rpc('budget_save_catalog_node', {",
                  "        p_node_id: nodeForm.node_id || null,",
                  "        p_node_type: nodeForm.node_type,",
                  "        p_parent_item_id: nodeForm.parent_item_id || null,",
                  "        p_branch_scope_id: nodeForm.branch_scope_id || null,",
                  "        p_group_key: parent?.group_key || nodeForm.group_key,",
                  "        p_name: nodeForm.name,",
                  "        p_unit_label: nodeForm.node_type === 'item' ? nodeForm.unit_label || null : null,",
                  "        p_calculation_type: nodeForm.node_type === 'item' ? nodeForm.calculation_type : null,",
                  "        p_external_source: nodeForm.calculation_type === 'external_forecast_actual' ? 'payroll_run' : null,",
                  "        p_cost_behavior: nodeForm.node_type === 'item' ? nodeForm.cost_behavior : null,",
                  "        p_is_active: nodeForm.is_active,",
                  "        p_notes: nodeForm.notes || null,",
                  "        p_sort_order: Number(nodeForm.sort_order || 0),",
                  "        p_rate_valid_from: nodeForm.node_type === 'item' ? revisionValidFrom : null,",
                  "        p_rate_params: rateParams,",
                  "        p_rate_source: rateParams ? 'manual_entry' : null,",
                  "        p_rate_bands: normalizedBands,",
                  "        p_schedule_valid_from: nodeForm.node_type === 'item' ? revisionValidFrom : null,",
                  "        p_schedule: schedulePayload,",
                  "        p_revision_mode: revisionMode,",
                  "        p_rate_version_id: revisionMode === 'correction' ? currentRate?.id || null : null,",
                  "        p_schedule_id: revisionMode === 'correction' ? currentSchedule?.id || null : null,",
                  "      });",
                  "      if (saveResult.error) throw saveResult.error;",
                  "",
              ]
              text = text[:start] + '\n'.join(lines) + text[end:]
              page.write_text(text)
          final = page.read_text()
          if 'budget_save_catalog_item_revision' in final:
              raise SystemExit('Parallel correction RPC still present in page.')
          if 'budget_save_catalog_node_v2' in final:
              raise SystemExit('Temporary v2 RPC still present in page.')
          PY
          git diff --check
          npm run budget:audit
          rm .github/workflows/_unify-budget-save-rpc.yml
          git config user.name arkan-system
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Use one operating budget catalog save gateway'
          git push origin HEAD:main

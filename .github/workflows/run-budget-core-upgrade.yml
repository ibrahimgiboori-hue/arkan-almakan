name: Run budget core upgrade
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-budget-core-upgrade.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade core budget code
        run: python .github/scripts/upgrade_budget_core.py
      - name: Validate diff
        run: git diff --check
      - name: Commit core change
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "arkan-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard/operating-budget/page.js
          git commit -m "Unify operating budget correction and monthly statement core"
          git push
